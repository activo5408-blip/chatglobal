name: Extract project sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-sources.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract project archives without deleting originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/android extracted/windows extracted/server
          unzip -o chatlan-android.zip -d extracted/android
          unzip -o chatlan-windows.zip -d extracted/windows
          unzip -o chatlan-server.zip -d extracted/server
          echo "Extracted file counts:"
          find extracted/android -type f | wc -l
          find extracted/windows -type f | wc -l
          find extracted/server -type f | wc -l
      - name: Commit extracted source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract Android, Windows, and server project sources"
            git push
          fi
