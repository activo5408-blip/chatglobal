name: Build ChatGlobal clients and test server
on:
  push:
    branches: [main]
    paths:
      - 'extracted/android/**'
      - 'extracted/windows/**'
      - 'extracted/server/**'
      - '.github/workflows/build-chatglobal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test server
        working-directory: extracted/server/chatlan-server
        run: node test/test.js
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: extracted/android/chatlan-android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chatglobal-android-debug-apk
          path: extracted/android/chatlan-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows client
        working-directory: extracted/windows/chatlan-main/src-tauri
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: chatglobal-windows-executable
          path: extracted/windows/chatlan-main/src-tauri/target/release/chatlan-main.exe
          if-no-files-found: warn

# Trigger initial validation run.
